# The headless suite IS the repo's contract: every push to main and every PR
# runs the frozen parity gate (the M7 plan's Global Constraints — the CI suite
# command is the LOCAL gate, verbatim; the runner's zero-check + script-error
# guards run here too).
#
# NO xvfb suites in CI — the headless suite is the gate and CI stays lean.
# The xvfb families (boot, the five bots, visuals, scene suites, perf probes)
# are the LOCAL/wrap sweep's contract: docs/PARITY-M6.md §15
# (tools/wrap_sweep_m6.sh, the strictly sequential 20-entry sweep).

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  suite:
    name: Headless suite + RID-leak ceiling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.2.2 (pinned — byte-identical to the milestone rig)
        run: |
          set -euo pipefail
          GODOT_URL="https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip"
          # sha256 of the official 4.2.2-stable linux zip; the zip's binary is
          # sha256-identical to the local milestone rig's ~/.local/bin/godot
          # (11666450f64c4e90cfbf7b795bbd3b07aa52ea1afb6feb73d0b4fee876f72def —
          # both print 4.2.2.stable.official.15073afe3).
          GODOT_SHA256="69eb9881e1b82ab93924c83106a7c031497f252bc0c08e199e4da6380072d6ef"
          curl -sSL -o /tmp/godot.zip "$GODOT_URL"
          echo "$GODOT_SHA256  /tmp/godot.zip" | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 /tmp/godot/Godot_v4.2.2-stable_linux.x86_64 /usr/local/bin/godot
          # the exact version string of the local rig — the pin is asserted, not assumed
          godot --version | grep -qx '4.2.2.stable.official.15073afe3'

      - name: Run the headless suite (the two-pass script-error guard included)
        run: |
          set -o pipefail
          godot --headless -s res://tests/run.gd --path . 2>&1 | tee ci-suite.log

      - name: RID-leak ceiling gate (the PARITY-M6 §11 / T8-review condition)
        run: |
          set -euo pipefail
          # The M7 MANDATORY gate (the M7 plan's Global Constraints; recorded at
          # docs/PARITY-M6.md §11). The pinned leak mechanism is un-freed
          # out-of-tree test boots — NOT a runtime leak — so the gate is the
          # 403 entry-datum CEILING; zero is the WRONG gate.
          RID_CEILING=403
          LOG="ci-suite.log"
          # The 4.2.2 exit-telemetry format, byte-verified on the milestone rig:
          #   WARNING: 403 RIDs of type "CanvasItem" were leaked.
          if [ ! -f "$LOG" ]; then
            echo "RID GATE FAIL: $LOG does not exist — the suite step never produced it."
            exit 1
          fi
          LINE="$(grep -E 'WARNING: [0-9]+ RIDs of type "CanvasItem" were leaked' "$LOG" | tail -n 1 || true)"
          if [ -z "$LINE" ]; then
            echo "RID GATE FAIL: no 'RIDs of type \"CanvasItem\" were leaked' line in $LOG."
            echo "  The pinned exit mechanism emits it on every suite exit — a missing"
            echo "  line means the format drifted or the parse broke; never silently green."
            echo "  (If the leak family is genuinely fixed, retire this gate deliberately.)"
            exit 1
          fi
          N="$(sed -E 's/.*WARNING: ([0-9]+) RIDs of type "CanvasItem".*/\1/' <<<"$LINE")"
          echo "RID gate: '$LINE' -> leaked CanvasItem RIDs = $N, ceiling = $RID_CEILING"
          if [ "$N" -gt "$RID_CEILING" ]; then
            echo "RID GATE FAIL: $N CanvasItem RIDs leaked > ceiling $RID_CEILING (PARITY-M6 §11)."
            exit 1
          fi
          echo "RID GATE OK: $N <= $RID_CEILING."

      - name: Upload the suite log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-suite-log
          path: ci-suite.log
